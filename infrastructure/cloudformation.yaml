AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Infrastructure for the Webhook Registry + Dispatcher technical challenge.

Resources:

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: webhook-registry-subscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: WebhookRegistry

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: webhook-registry-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: WebhookRegistry

  DeliveriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: webhook-registry-deliveries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: subscriptionId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: eventId-index
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: subscriptionId-index
          KeySchema:
            - AttributeName: subscriptionId
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: WebhookRegistry

Outputs:

  SubscriptionsTableName:
    Description: DynamoDB table containing webhook subscriptions
    Value: !Ref SubscriptionsTable

  EventsTableName:
    Description: DynamoDB table containing events
    Value: !Ref EventsTable

  DeliveriesTableName:
    Description: DynamoDB table containing delivery records
    Value: !Ref DeliveriesTable